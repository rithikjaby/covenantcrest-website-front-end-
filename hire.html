<script>
function setCookie(v){localStorage.setItem('cc_consent',v);document.getElementById('cc-bar').classList.remove('show');if(v==='accept')loadGA4();}
window.addEventListener('load',function(){
  if(localStorage.getItem('cc_consent')==='accept') loadGA4();
  if(!localStorage.getItem('cc_consent')) setTimeout(function(){document.getElementById('cc-bar').classList.add('show');},1400);
  var obs=new IntersectionObserver(function(en){en.forEach(function(e){if(e.isIntersecting){e.target.classList.add('vs');obs.unobserve(e.target);}});},{threshold:.1});
  document.querySelectorAll('.rv').forEach(function(el){obs.observe(el);el.classList.add('vs');});
});

document.getElementById('navToggle').addEventListener('click',function(){
  var l=document.getElementById('navLinks'),o=l.classList.toggle('open');
  this.innerHTML=o?'&#x2715;':'&#x2630;';
});

function handleReqStaff(e){
  e.preventDefault();
  var form=e.target;
  var btn=document.getElementById('rsb-submit-btn');
  if(btn){btn.disabled=true;btn.textContent='Sending…';}
  fetch('/',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams(new FormData(form)).toString()
  })
  .then(function(){
    document.getElementById('ok-req-b2b').classList.add('show');
    form.reset();
    if(btn){btn.disabled=false;btn.textContent='Send Employer Enquiry ?';}
  })
  .catch(function(){
    alert('Problem submitting. Please email recruitment@covenantcrest.co.uk or call 07346 809846.');
    if(btn){btn.disabled=false;btn.textContent='Send Employer Enquiry ?';}
  });
}
</script>
