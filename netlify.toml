# ─────────────────────────────────────────────────────────────────
# Covenant Crest Group Ltd — netlify.toml  v2.0
# ─────────────────────────────────────────────────────────────────
#
# HOW THE API PROXY WORKS
# ────────────────────────
# The frontend calls /api/... which Netlify proxies to your
# Render.com backend. This means:
#   • No CORS issues (same origin from the browser's perspective)
#   • Your Render URL stays hidden from the client
#
# SETUP STEPS
# ────────────
# 1. Deploy server.js to Render.com as a Web Service
# 2. Copy your Render service URL (e.g. https://covenant-crest-api.onrender.com)
# 3. Replace YOUR_RENDER_URL below with that URL
# 4. Push this file — the proxy is live immediately
#
# GOOGLE SEARCH CONSOLE VERIFICATION
# ────────────────────────────────────
# Use the "HTML tag" method:
#   a. Go to https://search.google.com/search-console
#   b. Add property → URL prefix → https://covenantcrest.co.uk
#   c. Choose "HTML tag" verification method
#   d. Copy the meta tag content value (looks like: abc123xyz...)
#   e. Replace GSC-VERIFICATION-CODE in index.html <head> with that value
#   f. Click Verify
# ─────────────────────────────────────────────────────────────────

[build]
  publish = "."

# ─── FORM SUBMISSION FLOW ──────────────────────────────────────
# Primary path  : JS → CCA API (Render.com) → MongoDB + email alerts
# Fallback path : JS → Netlify Forms → n8n webhook → Zoho CRM
#
# n8n WEBHOOK SETUP (one-time):
#   1. In Netlify: Site settings → Forms → Form notifications
#      → Add notification → Outgoing webhook
#   2. Webhook URL: https://your-n8n-instance.com/webhook/covenant-crest
#   3. Set the same secret in n8n and as NETLIFY_WEBHOOK_SECRET on Render
#   4. In n8n, route by form_name field:
#        candidate-apply    → Zoho CRM Contacts (crm_type=Candidate)
#        recruitment-request-staff → Zoho CRM Leads (crm_type=B2B_Employer)
#        haulage-quote      → Zoho CRM Leads (crm_type=B2B_Haulage)
#        trade-enquiry      → Zoho CRM Leads (crm_type=B2B_Trade)
#        quick_enquiry      → Zoho CRM Leads (crm_type=General_Enquiry)
#        compliance-pack-request → Zoho CRM Leads (crm_type=Compliance_Pack)
#        about_enquiry      → Zoho CRM Leads (crm_type=General_Enquiry)
#
# All form payloads include hidden fields: crm_lead_source, crm_module, crm_type
# These can be used directly as n8n filter/routing conditions.
# ─────────────────────────────────────────────────────────────────

# ─── Force WWW redirect ────────────────────────────────────────
[[redirects]]
  from   = "http://covenantcrest.co.uk/*"
  to     = "https://www.covenantcrest.co.uk/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://covenantcrest.co.uk/*"
  to     = "https://www.covenantcrest.co.uk/:splat"
  status = 301
  force  = true

# ─── API Proxy → Render.com backend ────────────────────────────
# IMPORTANT: Replace YOUR_RENDER_URL with your actual Render URL
# Example: https://covenant-crest-api.onrender.com
[[redirects]]
  from   = "/api/*"
  to     = "https://covenant-crest-backend-for-rendor.onrender.com/api/:splat"
  status = 200
  force  = true

# ─── Clean URLs (no .html extension) ───────────────────────────
[[redirects]]
  from   = "/hire"
  to     = "/hire.html"
  status = 200

[[redirects]]
  from   = "/apply"
  to     = "/apply.html"
  status = 200

[[redirects]]
  from   = "/recruitment"
  to     = "/recruitment.html"
  status = 200

[[redirects]]
  from   = "/haulage"
  to     = "/haulage.html"
  status = 200

[[redirects]]
  from   = "/trade"
  to     = "/trade.html"
  status = 200

[[redirects]]
  from   = "/job"
  to     = "/job.html"
  status = 200

[[redirects]]
  from   = "/about"
  to     = "/about.html"
  status = 200

[[redirects]]
  from   = "/terms"
  to     = "/terms.html"
  status = 200

[[redirects]]
