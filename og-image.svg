<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0D1B2A"/>
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#C9A84C" stroke-width="0.4" opacity="0.12"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="315" rx="520" ry="320" fill="url(#glow)"/>
  <!-- Gold accent bar left -->
  <rect x="80" y="220" width="4" height="190" fill="#C9A84C" opacity="0.6"/>
  <!-- Logo shield (exact markup from index.html .nav-logo) -->
  <svg x="100" y="215" width="100" height="100" viewBox="0 0 80 80" fill="none">
    <path d="M40 4 L72 18 L72 44 C72 60 57 72 40 76 C23 72 8 60 8 44 L8 18 Z" fill="none" stroke="#C9A84C" stroke-width="1.5" />
    <path d="M40 12 L64 23 L64 44 C64 57 53 67 40 70 C27 67 16 57 16 44 L16 23 Z" fill="none" stroke="#C9A84C" stroke-width="0.75" stroke-dasharray="2 2" />
    <line x1="40" y1="24" x2="40" y2="58" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round" />
    <line x1="24" y1="40" x2="56" y2="40" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="40" cy="24" r="2" fill="#C9A84C" />
    <circle cx="40" cy="58" r="2" fill="#C9A84C" />
    <circle cx="24" cy="40" r="2" fill="#C9A84C" />
    <circle cx="56" cy="40" r="2" fill="#C9A84C" />
    <rect x="37" y="37" width="6" height="6" fill="#C9A84C" transform="rotate(45 40 40)" />
  </svg>
  <!-- Company name: "Covenant Crest" together on one line, "Group Ltd" as small subtitle -->
  <text x="200" y="290" font-family="Georgia,serif" font-size="56" font-weight="400" fill="#ffffff" letter-spacing="1">Covenant <tspan fill="#C9A84C">Crest</tspan></text>
  <text x="200" y="322" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#C9A84C" letter-spacing="6" opacity="0.9">GROUP LTD</text>
  <!-- Divider -->
  <line x1="200" y1="400" x2="900" y2="400" stroke="#C9A84C" stroke-width="0.8" opacity="0.3"/>
  <!-- Tagline -->
  <text x="200" y="435" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#ffffff" opacity="0.5" letter-spacing="4">RECRUITMENT &#183; HAULAGE &#183; IMPORT &amp; DISTRIBUTION</text>
  <!-- URL -->
  <text x="200" y="490" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#C9A84C" opacity="0.6" letter-spacing="1">covenantcrest.co.uk</text>
  <!-- Company number -->
  <text x="200" y="520" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#ffffff" opacity="0.2" letter-spacing="1">Company No. 16528951 &#183; Registered in England &amp; Wales</text>
</svg>
